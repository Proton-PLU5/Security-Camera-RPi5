[project]
name = "security-camera-rpi5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.1",
    "aiortc>=1.14.0",
    "face-recognition>=1.3.0",
    "ncnn>=1.0.20260526",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "picamera2>=0.3.36",
    "prompt-toolkit>=3.0.52",
    "pyfiglet>=1.0.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomlkit>=0.15.0",
    "torch>=2.12.1",
    "ultralytics>=8.4.84",
]
[tool.uv]
override-dependencies = [
    "opencv-python<5.0.0",
    "opencv-python-headless<5.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
