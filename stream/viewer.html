<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camera Viewer</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 16px;
}

video {
    width: 95vw;
    max-width: 1200px;
    background: black;
    border: 1px solid #444;
}

#status {
    margin: 16px;
    font-size: 16px;
}

/* --- added for clip browsing/playback, nothing above this changed --- */

.panel {
    margin: 32px auto;
    padding: 16px;
    max-width: 1200px;
    width: 95vw;
    border: 1px solid #333;
    border-radius: 6px;
    text-align: left;
    box-sizing: border-box;
}

.row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.row input, .row button {
    background: #222;
    color: white;
    border: 1px solid #444;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 14px;
}

.row button {
    cursor: pointer;
}

.row button:hover {
    background: #333;
}

#clip-error {
    color: #f66;
    font-size: 13px;
    min-height: 18px;
}

ul#clip-list {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 240px;
    overflow-y: auto;
}

ul#clip-list li {
    padding: 8px;
    border-bottom: 1px solid #2a2a2a;
    cursor: pointer;
    font-size: 13px;
}

ul#clip-list li:hover {
    background: #1a1a1a;
}

ul#clip-list li.playing {
    background: #223;
}

/* double-buffered playback: both videos occupy the same box, only one
   visible at a time - swapping visibility (not src) avoids the
   black-frame/rebuffer flash a naive src-swap would cause */
#clip-player {
    position: relative;
    width: 95vw;
    max-width: 1200px;
    margin: 0 auto 16px;
    aspect-ratio: 16 / 9;
    background: black;
    display: none;
}

#clip-player video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

#clip-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* clicks pass through to the video underneath */
}
</style>
</head>

<body>

<h2>Live Camera</h2>

<video id="video" autoplay playsinline controls></video>

<div id="status">Starting...</div>

<!-- ============ everything below here is new ============ -->

<div class="panel">
    <h2>Recorded Clips</h2>

    <div class="row">
        <label for="clip-time">Jump to time:</label>
        <input type="datetime-local" id="clip-time" step="1">
        <button id="find-clip-btn">Find clip</button>
        <button id="refresh-list-btn">Refresh list</button>
    </div>
    <div id="clip-error"></div>

    <div id="clip-player">
        <video id="clip-video-a" playsinline></video>
        <video id="clip-video-b" playsinline style="display:none;"></video>
        <canvas id="clip-overlay"></canvas>
    </div>

    <ul id="clip-list"></ul>
</div>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");

function log(msg) {
    console.log(msg);
    status.textContent = msg;
}

async function start() {

    const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    pc.addTransceiver("video", {
        direction: "recvonly"
    });

    pc.ontrack = (event) => {
        console.log("Received video track");
        video.srcObject = event.streams[0];
        video.play().catch(console.error);
    };

    pc.onconnectionstatechange = () => {
        log("Connection: " + pc.connectionState);
    };

    pc.oniceconnectionstatechange = () => {
        console.log("ICE:", pc.iceConnectionState);
    };

    pc.onicegatheringstatechange = () => {
        console.log("ICE gathering:", pc.iceGatheringState);
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Wait until ICE gathering completes
    await new Promise(resolve => {
        if (pc.iceGatheringState === "complete") {
            resolve();
            return;
        }

        function check() {
            if (pc.iceGatheringState === "complete") {
                pc.removeEventListener(
                    "icegatheringstatechange",
                    check
                );
                resolve();
            }
        }

        pc.addEventListener(
            "icegatheringstatechange",
            check
        );
    });

    log("Sending offer...");

    const response = await fetch("/offer", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(pc.localDescription)
    });

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}: ${await response.text()}`
        );
    }

    const answer = await response.json();

    await pc.setRemoteDescription(answer);

    log("Waiting for video...");
}

start().catch(err => {
    console.error(err);
    log(err.toString());
});

// ============ everything below here is new: clip browsing/playback ============
// (double-buffered, auto-advancing - see chat for how the swap-not-reload trick works)

let clipsAsc = [];        // chronological order (oldest -> newest), for sequencing
let clipIdToIndex = {};   // id -> index in clipsAsc
let currentIndex = -1;
let activeIsA = true;

// detections cache: clipId -> { lowres_size: [h, w], detections: [...] }
// fetched/prefetched alongside video preloading, so it's ready by the
// time playback actually reaches that clip
const detectionsCache = {};
let lastLogSecond = -1;

async function fetchDetections(clipId) {
    if (!clipId || detectionsCache[clipId]) return;
    try {
        const res = await fetch("/clips/" + clipId + "/detections");
        if (!res.ok) return;
        detectionsCache[clipId] = await res.json();
        
        // LOG 1: Did we actually get boxes from the database?
        console.log(`[API] Loaded ${detectionsCache[clipId].detections.length} boxes for clip ${clipId}`);
        if (detectionsCache[clipId].detections.length > 0) {
            console.log(`[API] Sample box data:`, detectionsCache[clipId].detections[0]);
        }
    } catch (err) {
        console.error("Failed to fetch detections for", clipId, err);
    }
}

function drawOverlay() {
    const canvas = document.getElementById("clip-overlay");
    const ctx = canvas.getContext("2d");

    const { active } = getClipVideos();
    const clip = clipsAsc[currentIndex];

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!active || !clip || !active.videoWidth) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(drawOverlay);
        return;
    }

    if (canvas.width !== active.videoWidth || canvas.height !== active.videoHeight) {
        canvas.width = active.videoWidth;
        canvas.height = active.videoHeight;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cached = detectionsCache[clip.id];
    if (cached) {
        const [lowresW, lowresH] = cached.lowres_size;
        const scaleX = canvas.width / lowresW;
        const scaleY = canvas.height / lowresH;

        const t = active.currentTime;
        const TOLERANCE = 1;  // seconds

        // LOG 2: Check the timeline math once per second
        const currentSecond = Math.floor(t);
        if (currentSecond !== lastLogSecond) {
            lastLogSecond = currentSecond;
            console.log(`\n--- [Sync Check] Player Time: ${t.toFixed(2)}s ---`);
            
            if (cached.detections.length === 0) {
                console.log("-> No detections available to draw.");
            } else {
                const sample = cached.detections[0];
                const diff = Math.abs(sample.offset_seconds - t);
                console.log(`-> First Box Offset: ${sample.offset_seconds.toFixed(2)}s`);
                console.log(`-> Math Check: Is diff (${diff.toFixed(2)}s) <= Tolerance (${TOLERANCE})? ${diff <= TOLERANCE ? "YES (Drawing!)" : "NO (Skipping)"}`);
            }
        }

        ctx.strokeStyle = "#00ff88";
        ctx.lineWidth = 2;
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#00ff88";

        let boxesDrawn = 0;

        for (const d of cached.detections) {
            if (Math.abs(d.offset_seconds - t) > TOLERANCE) continue;
            
            boxesDrawn++;
            const x = d.bbox_x * scaleX;
            const y = d.bbox_y * scaleY;
            const w = d.bbox_width * scaleX;
            const h = d.bbox_height * scaleY;
            ctx.strokeRect(x, y, w, h);
            ctx.fillText(`${d.class_name} ${d.confidence.toFixed(2)}`, x, Math.max(y - 4, 10));
        }
        
        // LOG 3: Confirm if rendering actually executed
        if (boxesDrawn > 0 && currentSecond !== lastLogSecond) {
             console.log(`-> SUCCESS: Drew ${boxesDrawn} boxes to the canvas this frame.`);
        }
    }

    requestAnimationFrame(drawOverlay);
}
requestAnimationFrame(drawOverlay);


function getClipVideos() {
    return {
        active: document.getElementById(activeIsA ? "clip-video-a" : "clip-video-b"),
        hidden: document.getElementById(activeIsA ? "clip-video-b" : "clip-video-a"),
    };
}

function clipUrl(clipId) {
    return "/clips/" + clipId;
}

function preloadNextClip(index) {
    const { hidden } = getClipVideos();
    if (index >= 0 && index < clipsAsc.length) {
        hidden.src = clipUrl(clipsAsc[index].id);
        hidden.load();  // starts buffering without playing
    } else {
        hidden.removeAttribute("src");
        hidden.load();
    }
}

function highlightPlayingClip(clipId) {
    document.querySelectorAll("#clip-list li").forEach((li) => {
        li.classList.toggle("playing", li.dataset.clipId === clipId);
    });
}

function playClipAtIndex(index) {
    if (index < 0 || index >= clipsAsc.length) return;
    currentIndex = index;
    activeIsA = true;

    document.getElementById("clip-player").style.display = "block";

    const active = document.getElementById("clip-video-a");
    const hidden = document.getElementById("clip-video-b");
    active.style.display = "block";
    hidden.style.display = "none";

    active.src = clipUrl(clipsAsc[index].id);
    active.play().catch(console.error);
    highlightPlayingClip(clipsAsc[index].id);

    fetchDetections(clipsAsc[index].id);
    preloadNextClip(index + 1);
}

function handleClipEnded(sourceIsA) {
    if (sourceIsA !== activeIsA) return;  // stale event from the already-inactive video
    advanceToNextClip();
}

function advanceToNextClip() {
    const nextIndex = currentIndex + 1;
    if (nextIndex >= clipsAsc.length) {
        document.getElementById("clip-error").textContent = "End of recorded clips.";
        return;
    }

    activeIsA = !activeIsA;
    currentIndex = nextIndex;

    const { active, hidden } = getClipVideos();
    active.style.display = "block";
    hidden.style.display = "none";
    // active's src was already set by the previous preloadNextClip() call,
    // so this resumes an already-buffering video rather than issuing a
    // fresh network request - that's what keeps the transition tight.
    active.play().catch(console.error);
    highlightPlayingClip(clipsAsc[nextIndex].id);

    fetchDetections(clipsAsc[nextIndex].id);
    preloadNextClip(nextIndex + 1);
}

document.getElementById("clip-video-a").addEventListener("ended", () => handleClipEnded(true));
document.getElementById("clip-video-b").addEventListener("ended", () => handleClipEnded(false));

function formatClipLabel(clip) {
    try {
        // Ensure we have a valid number. If it's a string from a previous 
        // database state, parseFloat handles it.
        const startTime = typeof clip.started_at === 'string' ? parseFloat(clip.started_at) : clip.started_at;
        const endTime = typeof clip.ended_at === 'string' ? parseFloat(clip.ended_at) : clip.ended_at;

        if (!startTime || isNaN(startTime)) {
            return `Clip #${clip.id} (Invalid Date) [${clip.trigger || 'unknown'}]`;
        }

        const start = new Date(startTime);
        const end = endTime ? new Date(endTime) : null;
        
        const label = start.toLocaleString() + (end ? " \u2192 " + end.toLocaleTimeString() : " (in progress)");
        
        // Safely fallback if trigger is null/undefined
        const trigger = clip.trigger ? clip.trigger : "unknown";
        
        return `${label} [${trigger}]`;
    } catch (e) {
        console.error("Error formatting single clip data:", clip, e);
        return `Clip #${clip.id || 'unknown'} formatting error`;
    }
}

async function refreshClipList() {
    const list = document.getElementById("clip-list");
    list.innerHTML = "<li>Loading...</li>";
    try {
        const res = await fetch("/clips");
        const clipsDesc = await res.json();  // server returns newest-first

        clipsAsc = [...clipsDesc].reverse();  // oldest-first, for sequencing
        clipIdToIndex = {};
        clipsAsc.forEach((c, i) => { clipIdToIndex[c.id] = i; });

        list.innerHTML = "";
        // display newest-first (more natural for browsing), but each
        // entry's click handler looks up its chronological index for playback
        for (const clip of clipsDesc) {
            const li = document.createElement("li");
            li.textContent = formatClipLabel(clip);
            li.dataset.clipId = clip.id;
            li.onclick = () => playClipAtIndex(clipIdToIndex[clip.id]);
            list.appendChild(li);
        }
        if (clipsDesc.length === 0) {
            list.innerHTML = "<li>No clips recorded yet.</li>";
        }
    } catch (err) {
        list.innerHTML = "<li>Failed to load clips.</li>";
        console.error(err);
    }
}

async function findClipAtTime() {
    const errorEl = document.getElementById("clip-error");
    errorEl.textContent = "";

    const input = document.getElementById("clip-time").value;
    if (!input) {
        errorEl.textContent = "Pick a date/time first.";
        return;
    }

    // datetime-local gives local time with no timezone info - convert to
    // a real Date (interpreted as local) then to UTC ISO, since the
    // server compares against UTC-stored timestamps.
    const isoUtc = new Date(input).toISOString();

    try {
        const res = await fetch("/clips/find?timestamp=" + encodeURIComponent(isoUtc));
        if (!res.ok) {
            const body = await res.json();
            errorEl.textContent = body.error || "No clip found for that time.";
            return;
        }
        const clip = await res.json();
        if (!(clip.id in clipIdToIndex)) {
            await refreshClipList();
        }
        playClipAtIndex(clipIdToIndex[clip.id]);
    } catch (err) {
        errorEl.textContent = "Request failed.";
        console.error(err);
    }
}

document.getElementById("find-clip-btn").addEventListener("click", findClipAtTime);
document.getElementById("refresh-list-btn").addEventListener("click", refreshClipList);

refreshClipList();

</script>

</body>
</html>
