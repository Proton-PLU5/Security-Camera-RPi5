<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Camera WebRTC Viewer</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }

    h2 {
      margin: 12px;
    }

    video {
      width: 95vw;
      max-width: 1200px;
      background: black;
      border-radius: 8px;
    }

    #status {
      margin: 10px;
      color: #7fd4ff;
    }
  </style>
</head>

<body>

  <h2>Live Stream</h2>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Connecting...</div>

<script>
const video = document.getElementById("video");
const statusEl = document.getElementById("status");

function setStatus(msg) {
  console.log(msg);
  statusEl.textContent = msg;
}

async function waitForIceGathering(pc) {
  if (pc.iceGatheringState === "complete") return;

  await new Promise(resolve => {
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
  });
}

async function start() {
  const pc = new RTCPeerConnection({
    iceServers: [] // LAN-only setup (good for Raspberry Pi)
  });

  pc.addTransceiver("video", { direction: "recvonly" });

  pc.ontrack = (event) => {
    setStatus("Video received");
    video.srcObject = event.streams[0];
  };

  pc.onconnectionstatechange = () => {
    setStatus("Connection: " + pc.connectionState);

    if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
      setTimeout(start, 2000);
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log("ICE:", pc.iceConnectionState);
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) console.log("ICE candidate:", e.candidate);
  };

  setStatus("Creating offer...");

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await waitForIceGathering(pc);

  setStatus("Sending offer...");

  // IMPORTANT FIX: relative URL avoids http://:8080 bug completely
  const response = await fetch("/offer", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(pc.localDescription)
  });

  const answer = await response.json();
  await pc.setRemoteDescription(answer);

  setStatus("Connected");
}

start().catch(err => {
  console.error(err);
  setStatus("Error: " + err);
});
</script>

</body>
</html>
